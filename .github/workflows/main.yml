name: Daily Checkin

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 dailycheckin
        run: |
          pip install --upgrade dailycheckin

      - name: 生成配置文件并运行签到
        env:
          CHECKIN_CONFIG: ${{ secrets.CHECKIN_CONFIG }}
        run: |
          python3 -c "
          import os, json, shutil
          cfg = json.loads(os.environ['CHECKIN_CONFIG'])
          # 同时在根目录和子目录写入，确保无论哪层都能读到
          for p in ['config.json', 'dailycheckin/config.json']:
              try:
                  os.makedirs(os.path.dirname(p), exist_ok=True)
                  with open(p, 'w', encoding='utf-8') as f:
                      json.dump(cfg, f, ensure_ascii=False, indent=2)
                  print(f'成功写入配置文件至: {p}')
              except Exception as e:
                  pass
          "
          echo "=== 检查支持的命令参数 ==="
          dailycheckin --help || true
          echo -e "\n=== 开始执行签到 ==="
          dailycheckin --include NETEASE_CLOUD_MUSIC || dailycheckin
