name: Daily Checkin

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 dailycheckin
        run: |
          pip install --upgrade dailycheckin

      - name: 自动生成文件并签到
        env:
          CHECKIN_CONFIG: ${{ secrets.CHECKIN_CONFIG }}
        run: |
          mkdir -p config
          python3 -c "
          import os, json
          cfg = json.loads(os.environ['CHECKIN_CONFIG'])
          with open('config/config.json', 'w', encoding='utf-8') as f:
              json.dump(cfg, f, ensure_ascii=False, indent=2)
          "
          echo "=== 配置文件生成完毕，开始签到 ==="
          dailycheckin
