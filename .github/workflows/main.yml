name: Daily Checkin

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 dailycheckin
        run: |
          pip install --upgrade dailycheckin

      - name: 生成配置文件并运行签到
        env:
          CHECKIN_CONFIG: ${{ secrets.CHECKIN_CONFIG }}
        run: |
          python3 -c "
          import os, json
          cfg_str = os.environ.get('CHECKIN_CONFIG', '')
          print('--- 原始配置长度 ---:', len(cfg_str))
          try:
              data = json.loads(cfg_str)
              print('--- 成功解析到的配置项 ---:', list(data.keys()))
              with open('config.json', 'w', encoding='utf-8') as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
          except Exception as e:
              print('--- JSON解析失败 ---:', e)
          "
          echo "=== 正在执行 dailycheckin ==="
          dailycheckin
