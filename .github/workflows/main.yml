name: Daily Checkin

on:
  schedule:
    # 每天北京时间 09:00 自动运行 (UTC 01:00)
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 dailycheckin
        run: |
          pip install --upgrade dailycheckin

      - name: 生成配置文件并运行签到
        env:
          CHECKIN_CONFIG: ${{ secrets.CHECKIN_CONFIG }}
        run: |
          python3 -c "import os; open('config.json', 'w', encoding='utf-8').write(os.environ.get('CHECKIN_CONFIG', ''))"
          echo "=== 配置文件已成功写入 ==="
          dailycheckin
