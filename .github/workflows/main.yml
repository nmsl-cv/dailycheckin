name: Daily Checkin

on:
  schedule:
    # 每天北京时间 09:17 自动运行（timezone 字段为 GitHub Actions 2026-03 新增）
    - cron: '17 9 * * *'
      timezone: "Asia/Shanghai"
  # 支持在 GitHub 页面手动点击触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 dailycheckin
        run: |
          pip install --upgrade dailycheckin

      - name: 自动生成文件并签到
        env:
          CHECKIN_CONFIG: ${{ secrets.CHECKIN_CONFIG }}
        run: |
          # 1. 打印当前库支持的所有键名
          echo "=== 正在检查当前版本支持的全部平台键名 ==="
          python3 -c "
          import dailycheckin.configs as c
          # 尝试获取注册的配置映射
          keys = list(c.checkin_map.keys()) if hasattr(c, 'checkin_map') else [attr for attr in dir(c) if attr.isupper()]
          print('支持的有效平台大写键名列表:', keys)
          "

          # 2. 生成配置文件
          mkdir -p config
          python3 -c "
          import os, json
          cfg = json.loads(os.environ['CHECKIN_CONFIG'])
          with open('config/config.json', 'w', encoding='utf-8') as f:
              json.dump(cfg, f, ensure_ascii=False, indent=2)
          "
          echo "=== 配置文件生成完毕 ==="
          cat config/config.json

          # 3. 开始执行签到
          echo -e "\n=== 开始执行每日签到 ==="
          dailycheckin
