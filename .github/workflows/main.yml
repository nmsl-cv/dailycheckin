name: Daily Checkin

on:
  schedule:
    # 每天北京时间上午 09:00 自动运行 (对应 UTC 01:00)
    - cron: '0 1 * * *'
  # 支持在 GitHub 网页手动点击触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 dailycheckin
        run: |
          pip install --upgrade dailycheckin

      - name: 生成配置文件并运行签到
        env:
          CHECKIN_CONFIG: ${{ secrets.CHECKIN_CONFIG }}
        run: |
          cat << 'EOF' > config.json
          $CHECKIN_CONFIG
          EOF
          echo "=== 配置文件检查 ==="
          cat config.json
          echo -e "\n=== 开始执行每日签到 ==="
          dailycheckin
